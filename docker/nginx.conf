server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # mdbook выдаёт настоящие .html-файлы, но внутренние и написанные вручную
    # ссылки иногда не содержат расширения. Поддержка обоих вариантов сохраняет
    # поведение GitHub Pages.
    #
    # ПРИМЕЧАНИЕ: add_header НЕ наследуется блоком, в котором объявлен свой
    # add_header, поэтому каждый location повторяет нужные заголовки, а не
    # полагается на объявление на уровне server.
    location / {
        try_files $uri $uri/ $uri.html =404;

        add_header Cache-Control          "no-cache"     always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header Referrer-Policy        "no-referrer"  always;
    }

    # Ресурсы mdbook (book.js, ace.js, css) не имеют хэшей в именах: один и тот
    # же URL отдаёт новые байты после пересборки, поэтому их нельзя помечать
    # как immutable. Короткий срок жизни кэша дёшев и не закрепляет устаревший
    # JS в браузерах, которые не проверяют его повторно.
    location ~* \.(css|js|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        expires 1d;

        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header Referrer-Policy        "no-referrer"  always;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff font/woff2;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
